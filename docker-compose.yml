version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riset-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-net

networks:
  app-net:
    external: true